name: Build Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        shell: powershell
        run: npm ci --no-audit --no-fund

      - name: Build portable package
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $artifacts = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Path $artifacts -Force | Out-Null

          .\build\Build-Portable.ps1 `
            -Workspace $PWD `
            -Version $version `
            -OutputDirectory $artifacts

      - name: Validate release artifacts
        shell: powershell
        run: |
          $zip = Get-ChildItem .\artifacts -Filter '*.zip' -File | Select-Object -First 1
          $hash = Get-ChildItem .\artifacts -Filter '*.sha256.txt' -File | Select-Object -First 1

          if (-not $zip) { throw 'Portable ZIP was not created in the artifacts directory.' }
          if (-not $hash) { throw 'SHA256 file was not created in the artifacts directory.' }

          Write-Host "ZIP: $($zip.FullName)"
          Write-Host "SHA256: $($hash.FullName)"
          Get-Content $hash.FullName

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true