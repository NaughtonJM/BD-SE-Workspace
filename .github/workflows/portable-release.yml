name: Build Portable Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Validate, Publish, Verify
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      HEALTH_URL: http://127.0.0.1:3000/api/health
      V20_HEALTH_URL: http://127.0.0.1:3000/api/v20/health

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Verify release context and runtime dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $commit = (git rev-parse HEAD).Trim()
          if (git status --porcelain) { throw "Checkout is not clean." }

          $source = Get-Content .\server.js -Raw
          $matches = [regex]::Matches($source, 'require\(["''](\./[^"'']+)["'']\)')
          $missing = @()

          foreach ($m in $matches) {
            $rel = $m.Groups[1].Value
            # Node local require paths may contain version dots (for example v21.1.2)
            # without having a real file extension. Resolve only known JS extensions
            # explicitly; otherwise use normal CommonJS extension/index candidates.
            $knownJsExtension = $rel -match '\.(js|cjs|mjs)$'
            if ($knownJsExtension) {
              $candidates = @($rel)
            }
            else {
              $candidates = @("$rel.js", "$rel.cjs", "$rel.mjs", "$rel\index.js")
            }
            $found = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if (-not $found) { $missing += "$rel (missing)"; continue }
            $gitPath = $found.Replace(".\", "").Replace("\", "/")
            git ls-files --error-unmatch -- $gitPath 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { $missing += "$gitPath (untracked)" }
          }

          if ($missing) { throw "Runtime dependency gate failed: $($missing -join ', ')" }
          "RELEASE_COMMIT=$commit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install source dependencies
        shell: powershell
        run: npm.cmd ci --no-audit --no-fund

      - name: Validate tagged source startup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $env:RUNNER_TEMP 'source-output.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'source-error.log'
          $p = Start-Process node.exe -ArgumentList 'server.js' -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "Source exited early: $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)" }
              try {
                $h = Invoke-RestMethod -Uri $env:HEALTH_URL -TimeoutSec 5
                if ($h.status -eq 'running') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'Source health check failed.' }
            Invoke-RestMethod -Uri $env:V20_HEALTH_URL -TimeoutSec 10 | Out-Null
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Build portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $version = "workflow-$env:GITHUB_RUN_NUMBER" }
          $artifacts = Join-Path $PWD 'artifacts'
          Remove-Item $artifacts -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $artifacts -Force | Out-Null
          .\build\Build-Portable.ps1 -Workspace $PWD -Version $version -OutputDirectory $artifacts
          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate build checksum
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zips = @(Get-ChildItem .\artifacts -Filter '*.zip' -File)
          $sums = @(Get-ChildItem .\artifacts -Filter '*.sha256.txt' -File)
          if ($zips.Count -ne 1) { throw "Expected 1 ZIP, found $($zips.Count)." }
          if ($sums.Count -ne 1) { throw "Expected 1 sidecar, found $($sums.Count)." }
          $zip = $zips[0]; $sum = $sums[0]
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
          $sidecar = (((Get-Content $sum.FullName -Raw).Trim() -split '\s+')[0]).ToUpperInvariant()
          if ($actual -ne $sidecar) { throw 'Build ZIP checksum mismatch.' }
          "RELEASE_ZIP=$($zip.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP_NAME=$($zip.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA_FILE=$($sum.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA_NAME=$($sum.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA256=$actual" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract and validate portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $extract = Join-Path $env:RUNNER_TEMP 'portable-extracted'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $env:RELEASE_ZIP -DestinationPath $extract -Force
          $launcher = Get-ChildItem $extract -Filter 'Start-BD-SE-Workspace.cmd' -File -Recurse | Select-Object -First 1
          if (-not $launcher) { throw 'Portable launcher missing.' }
          $root = $launcher.Directory.FullName
          foreach ($f in @('server.js','package.json','unified-evidence-core-v21.1.2.js','content-freshness-v21.1.5.js','database\schema.sql')) {
            if (-not (Test-Path (Join-Path $root $f))) { throw "Portable package missing $f" }
          }
          "PORTABLE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate extracted portable startup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $env:RUNNER_TEMP 'portable-output.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'portable-error.log'
          $p = Start-Process node.exe -ArgumentList 'server.js' -WorkingDirectory $env:PORTABLE_ROOT -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "Portable exited early: $(Get-Content $stderr -Raw -ErrorAction SilentlyContinue)" }
              try {
                $h = Invoke-RestMethod -Uri $env:HEALTH_URL -TimeoutSec 5
                if ($h.status -eq 'running') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'Extracted portable health check failed.' }
            Invoke-RestMethod -Uri $env:V20_HEALTH_URL -TimeoutSec 10 | Out-Null
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Verify published assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP 'published-release'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --dir $dir --pattern $env:RELEASE_ZIP_NAME --pattern $env:RELEASE_SHA_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Published asset download failed.' }
          $zip = Join-Path $dir $env:RELEASE_ZIP_NAME
          $sum = Join-Path $dir $env:RELEASE_SHA_NAME
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          $sidecar = (((Get-Content $sum -Raw).Trim() -split '\s+')[0]).ToUpperInvariant()
          if ($actual -ne $env:RELEASE_SHA256) { throw 'Published ZIP differs from built ZIP.' }
          if ($sidecar -ne $actual) { throw 'Published sidecar differs from published ZIP.' }
          Write-Host "VERIFIED RELEASE: $env:GITHUB_REF_NAME"
          Write-Host "COMMIT: $env:RELEASE_COMMIT"
          Write-Host "SHA256: $actual"